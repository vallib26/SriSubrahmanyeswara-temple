<circle class="halo-ring" cx="60" cy="54" r="46" fill="url(#haloGrad)"/>
<!-- hair -->
<path d="M32 50 Q28 26 60 22 Q92 26 88 50 Q90 66 84 70 Q86 50 60 44 Q34 50 36 70 Q30 66 32 50Z" fill="#241A17"/>
