<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="skybg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#0F5257"/><stop offset="100%" stop-color="#7A1F2B"/>
</linearGradient>
<linearGradient id="gopuramGold" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#E4C765"/><stop offset="100%" stop-color="#C9A227"/>
</linearGradient>
</defs>
<rect width="400" height="300" fill="url(#skybg)"/>
<circle cx="330" cy="55" r="28" fill="#F7F0E3" opacity="0.85"/>
<!-- tiered gopuram -->
<g fill="url(#gopuramGold)" stroke="#F7F0E3" stroke-width="1.5">
<rect x="150" y="230" width="100" height="60"/>
<rect x="160" y="200" width="80" height="30"/>
<rect x="170" y="172" width="60" height="28"/>
<rect x="180" y="146" width="40" height="26"/>
<rect x="188" y="120" width="24" height="26"/>
<path d="M188 120 L200 96 L212 120 Z"/>
<circle cx="200" cy="90" r="6" fill="#F7F0E3"/>
</g>
<!-- side pillars -->
<rect x="120" y="230" width="20" height="60" fill="#7A1F2B" stroke="#E4C765" stroke-width="1"/>
<rect x="260" y="230" width="20" height="60" fill="#7A1F2B" stroke="#E4C765" stroke-width="1"/>
<!-- steps -->
<rect x="100" y="290" width="200" height="8" fill="#EFE4CC"/>
<rect x="90" y="298" width="220" height="2" fill="#DED0AC"/>
<!-- decorative dots on tiers -->
<g fill="#7A1F2B">
<circle cx="165" cy="215" r="2"/><circle cx="185" cy="215" r="2"/><circle cx="205" cy="215" r="2"/><circle cx="225" cy="215" r="2"/>
<circle cx="180" cy="186" r="2"/><circle cx="200" cy="186" r="2"/><circle cx="220" cy="186" r="2"/>
</g>
</svg>
